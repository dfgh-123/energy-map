<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>能源专业地图 · Energy Discipline Map</title>
<meta name="description" content="把能源从基础科学、技术器件到系统社会串成一张可交互的地图：49 个节点、125 条关联、四条学习路径。">
<meta property="og:type" content="website">
<meta property="og:title" content="能源专业地图">
<meta property="og:description" content="49 个节点、125 条关联，从热力学与电化学到电池、光伏、电网与政策，一张可缩放、可点开的能源学科地图。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0e14'/%3E%3Cpath d='M17.5 6 9 18h6l-1.5 8L23 14h-6z' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#080b10;
    --panel:rgba(12,17,24,.94);
    --line:rgba(255,255,255,.08);
    --line2:rgba(255,255,255,.14);
    --text:#e8eef5;
    --muted:#8b98a8;
    --dim:#5d6b7c;
    --base:#38bdf8;
    --tech:#fbbf24;
    --sys:#a78bfa;
    --mono:ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font:14px/1.65 "Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::selection{background:rgba(56,189,248,.3)}

  #app{height:100%;display:flex;flex-direction:column}

  /* ---------- header ---------- */
  header{
    height:58px;flex:0 0 58px;display:flex;align-items:center;gap:18px;
    padding:0 16px 0 20px;border-bottom:1px solid var(--line);
    background:rgba(8,11,16,.92);backdrop-filter:blur(14px);z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.02em}
  .brand .en{font:11px/1 var(--mono);color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
  .search{position:relative;flex:1;max-width:420px;margin-left:auto}
  .search input{
    width:100%;height:34px;padding:0 12px 0 32px;border-radius:8px;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
    color:var(--text);font-size:13px;outline:none;transition:.18s;
  }
  .search input:focus{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.06)}
  .search input::placeholder{color:var(--dim)}
  .search .ico{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:13px;height:13px;opacity:.45;pointer-events:none;
  }
  #results{
    position:absolute;top:40px;left:0;right:0;z-index:40;display:none;
    background:#0d131b;border:1px solid var(--line2);border-radius:10px;
    box-shadow:0 16px 40px rgba(0,0,0,.6);overflow:hidden;
  }
  #results.show{display:block}
  #results button{
    display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;
    text-align:left;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);
  }
  #results button:last-child{border-bottom:none}
  #results button:hover,#results button.act{background:rgba(56,189,248,.10)}
  #results .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  #results .ly{margin-left:auto;font:10px/1 var(--mono);color:var(--dim);letter-spacing:.08em}

  .tools{display:flex;gap:6px}
  .tbtn{
    height:30px;padding:0 11px;border-radius:7px;font-size:12px;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.16s;
  }
  .tbtn:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.07)}

  /* ---------- main ---------- */
  #main{flex:1;display:flex;min-height:0;position:relative}

  /* rail */
  #rail{
    width:214px;flex:0 0 214px;border-right:1px solid var(--line);
    padding:16px 14px 18px;overflow:hidden;background:rgba(255,255,255,.012);
    display:flex;flex-direction:column;
  }
  #rail h2{
    font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin:0 0 10px;
  }
  .block{margin-bottom:16px}
  /* 章节条 */
  #chapters{
    flex:0 0 44px;display:flex;align-items:center;gap:10px;
    padding:0 16px 0 20px;border-bottom:1px solid var(--line);
    background:rgba(10,14,20,.72);z-index:19;
  }
  #chapters .ch{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  #chapters .ch::-webkit-scrollbar{display:none}
  .cbtn{
    height:28px;padding:0 13px;border-radius:7px;font-size:12.5px;
    color:var(--muted);border:1px solid transparent;transition:.16s;white-space:nowrap;
  }
  .cbtn:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .cbtn.on{color:#07111a;background:#dce9f6;font-weight:600}
  .pager{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  #cnum{font:10px/1 var(--mono);color:var(--dim);letter-spacing:.12em;min-width:40px;text-align:center}
  #prev,#next{width:28px;padding:0;display:grid;place-items:center;font-size:13px}

  /* 目录 */
  .tocblock{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:16px}
  #toc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px;margin:0 -5px;padding-right:4px;
    -webkit-mask-image:linear-gradient(#000 calc(100% - 20px),transparent);mask-image:linear-gradient(#000 calc(100% - 20px),transparent)}
  .toc-item{
    display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;
    font-size:12.5px;color:var(--muted);text-align:left;transition:.14s;width:100%;
  }
  .toc-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .toc-item.on{background:rgba(56,189,248,.16);color:#fff}
  .toc-item i{width:5px;height:5px;border-radius:50%;flex:0 0 5px;font-style:normal}
  .toc-item em{margin-left:auto;font:9.5px/1 var(--mono);color:var(--dim);font-style:normal}
  .toc-group{
    font:9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);
    margin:12px 6px 5px;text-transform:uppercase;
  }
  .toc-group:first-child{margin-top:0}

  .legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .legend .row{display:flex;align-items:center;gap:8px}
  .legend .sw{width:8px;height:8px;border-radius:2px}
  .note{
    font-size:11px;color:var(--dim);line-height:1.6;border-top:1px solid var(--line);
    padding-top:10px;margin-top:0;
  }
  .note b{color:var(--muted);font-weight:500}
  kbd{
    font:10px/1 var(--mono);padding:2px 4px;border-radius:3px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);
  }

  /* stage */
  #stage{
    flex:1;position:relative;overflow:hidden;min-width:0;
    background:
      radial-gradient(900px 500px at 30% 0%,rgba(56,189,248,.055),transparent 60%),
      radial-gradient(700px 400px at 85% 100%,rgba(167,139,250,.045),transparent 60%),
      #080b10;
    cursor:grab;
  }
  #stage.grabbing{cursor:grabbing}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #hint{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    font-size:11.5px;color:var(--dim);white-space:nowrap;
    padding:6px 14px;border-radius:20px;background:rgba(8,11,16,.7);
    border:1px solid var(--line);backdrop-filter:blur(8px);
    transition:opacity .6s;pointer-events:none;
  }
  #hint.hide{opacity:0}

  /* svg bits */
  .band-label{font:11px/1 var(--mono);letter-spacing:.18em;fill:rgba(255,255,255,.22);text-transform:uppercase}
  .chain-label{font:11.5px/1 "Noto Sans SC",sans-serif;letter-spacing:.1em;fill:rgba(255,255,255,.3)}

  .link{fill:none;stroke:rgba(255,255,255,.095);stroke-width:1;vector-effect:non-scaling-stroke;transition:opacity .2s,stroke .2s}
  .link.on{stroke:rgba(255,255,255,.55);opacity:1!important}
  .link.path{stroke:rgba(56,189,248,.75);stroke-width:1.6}
  .link.off{opacity:.07}

  .node{cursor:pointer;transition:opacity .2s}
  .node .pill{
    fill:rgba(56,189,248,.09);stroke:rgba(56,189,248,.42);stroke-width:1;
    vector-effect:non-scaling-stroke;transition:fill .18s,stroke .18s;
  }
  .node.tech .pill{fill:rgba(251,191,36,.09);stroke:rgba(251,191,36,.42)}
  .node.sys  .pill{fill:rgba(167,139,250,.09);stroke:rgba(167,139,250,.42)}
  .node .label{font-size:14.5px;font-weight:450;fill:#cddceb;pointer-events:none;transition:fill .18s}
  .node.core .pill{fill-opacity:1;fill:rgba(56,189,248,.16);stroke-opacity:.85}
  .node.core.tech .pill{fill:rgba(251,191,36,.16)}
  .node.core.sys  .pill{fill:rgba(167,139,250,.16)}
  .node.core .label{font-size:16px;font-weight:600;fill:#fff}
  .node.hot .pill{stroke-width:2.4;fill-opacity:1}
  .node.hot .label{fill:#fff}
  .node.sel .pill{stroke-width:2.6;filter:url(#glow)}
  .node.sel .label{fill:#fff}
  .node.off{opacity:.13}
  .node.fade{opacity:.35}
  .num{
    font:600 11px/1 var(--mono);fill:#0a0f16;opacity:0;pointer-events:none;
  }
  .node.inpath .num{opacity:1}
  .num-bg{fill:#38bdf8;opacity:0}
  .node.inpath .num-bg{opacity:1}

  /* panel */
  #panel{
    position:absolute;top:0;right:0;bottom:0;width:min(392px,48%);z-index:15;
    background:var(--panel);backdrop-filter:blur(20px);
    border-left:1px solid var(--line2);overflow-y:auto;
    transform:translateX(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:-24px 0 60px rgba(0,0,0,.5);
  }
  #panel.open{transform:none}
  #panel .close{
    position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:7px;
    display:grid;place-items:center;color:var(--dim);font-size:16px;
  }
  #panel .close:hover{background:rgba(255,255,255,.08);color:var(--text)}
  #pbody{padding:26px 24px 40px}

  .p-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .b{
    font:10.5px/1 var(--mono);letter-spacing:.1em;padding:5px 8px;border-radius:5px;
    border:1px solid;text-transform:uppercase;
  }
  .b.base{color:var(--base);border-color:rgba(56,189,248,.35);background:rgba(56,189,248,.09)}
  .b.tech{color:var(--tech);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.09)}
  .b.sys{color:var(--sys);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.09)}
  .b.chain{color:var(--muted);border-color:var(--line2);background:rgba(255,255,255,.04)}
  .b.path{color:#0a0f16;background:var(--base);border-color:transparent;font-weight:700}

  #pbody h2{font-size:22px;font-weight:600;margin:0 0 8px;letter-spacing:.01em}
  .lede{font-size:13.5px;line-height:1.85;color:#a9b8c8;margin:0 0 4px}

  .p-block{margin-top:26px}
  .p-block h3{
    font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin:0 0 11px;font-weight:500;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{
    font-size:12px;padding:4px 9px;border-radius:5px;color:#9fb0c2;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
  }
  .lchip{
    font-size:12px;padding:5px 10px;border-radius:6px;transition:.15s;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
  }
  .lchip:hover{background:rgba(255,255,255,.1);border-color:var(--line2)}
  .lchip.base{color:#8fd4f8;border-color:rgba(56,189,248,.22)}
  .lchip.tech{color:#f5cd74;border-color:rgba(251,191,36,.22)}
  .lchip.sys{color:#c4b0fb;border-color:rgba(167,139,250,.22)}

  ol.steps{list-style:none;margin:0;padding:0;counter-reset:st}
  ol.steps li{
    display:flex;align-items:center;gap:12px;padding:10px 8px;margin:0 -8px;
    border-radius:8px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.045);
  }
  ol.steps li:hover{background:rgba(255,255,255,.05)}
  ol.steps b{
    flex:0 0 22px;height:22px;border-radius:50%;background:rgba(56,189,248,.16);
    color:var(--base);font:600 11px/22px var(--mono);text-align:center;
  }
  ol.steps span{font-size:13.5px}
  ol.steps em{margin-left:auto;font:10px/1 var(--mono);font-style:normal;color:var(--dim);letter-spacing:.08em}

  #menu{display:none;width:28px;padding:0;place-items:center;font-size:13px;flex:0 0 auto}
  .scrim{
    position:absolute;inset:0;z-index:11;background:rgba(4,7,11,.62);
    backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .26s;
  }
  .scrim.on{opacity:1;pointer-events:auto}

  @media (max-width:900px){
    #rail{
      position:absolute;left:0;top:0;bottom:0;z-index:12;width:250px;flex-basis:250px;
      background:#0a0e14;transform:translateX(-101%);
      transition:transform .26s cubic-bezier(.4,0,.2,1);
      box-shadow:12px 0 40px rgba(0,0,0,.55);
    }
    #rail.show{transform:none}
    #menu{display:grid}
    .brand .en{display:none}
  }
  @media (max-width:640px){
    header{height:50px;flex:0 0 50px;gap:9px;padding:0 10px 0 14px}
    .brand h1{font-size:14px}
    .search input{height:30px;font-size:12px}
    .tools #fit,.tools #reset{display:none}
    .pager{display:none}
    #chapters{padding:0 10px 0 6px;gap:6px;height:40px;flex-basis:40px}
    .cbtn{padding:0 8px;font-size:11.5px;height:26px}
    #cnum{min-width:34px;font-size:9.5px}
    #panel{width:100%}
    #pbody{padding:22px 18px 34px}
    #pbody h2{font-size:20px}
    #hint{font-size:10.5px;padding:5px 10px;bottom:12px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>能源专业地图</h1>
      <span class="en">Energy Discipline Map</span>
    </div>
    <div class="search">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/>
      </svg>
      <input id="q" type="text" placeholder="搜索学科、技术或概念,如 电化学 / 储能 / 电网" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <div class="tools">
      <button class="tbtn" id="fit">全览</button>
      <button class="tbtn" id="reset">重置</button>
    </div>
  </header>

  <nav id="chapters">
    <button class="tbtn" id="menu" title="目录">☰</button>
    <div class="ch"></div>
    <div class="pager">
      <button class="tbtn" id="prev" title="上一章（←）">←</button>
      <span id="cnum"></span>
      <button class="tbtn" id="next" title="下一章（→）">→</button>
    </div>
  </nav>

  <div id="main">
    <aside id="rail">
      <div class="block tocblock">
        <h2 id="toch">本章目录</h2>
        <div id="toc"></div>
      </div>

      <div class="block">
        <h2>图例</h2>
        <div class="legend">
          <div class="row"><span class="sw" style="background:var(--base)"></span>基础科学 · 原理与约束</div>
          <div class="row"><span class="sw" style="background:var(--tech)"></span>技术器件 · 转换与存储</div>
          <div class="row"><span class="sw" style="background:var(--sys)"></span>系统社会 · 市场与政策</div>
        </div>
      </div>

      <div class="note" id="stat"></div>
      <div class="note">
        <b>操作</b><br>
        拖拽 平移 · 滚轮 缩放<br>
        <kbd>点击</kbd> 节点看详情 · <kbd>Esc</kbd> 关闭
      </div>
    </aside>

    <div id="stage">
      <svg id="map"></svg>
      <div id="hint">拖拽平移 · 滚轮缩放 · 点击节点查看它是什么、连着谁</div>
    </div>

    <div class="scrim" id="scrim"></div>

    <aside id="panel">
      <button class="close" id="close">✕</button>
      <div id="pbody"></div>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';

const NS='http://www.w3.org/2000/svg';
const WORLD={w:1400,h:1060};

/* ============================================================
   数据：48 个节点，三层
   l: base=基础科学 / tech=技术器件 / sys=系统社会
   c: 能量链环节（仅技术层）
   ============================================================ */
const NODES=[
  /* ---------- 基础层 ---------- */
  {id:'math',n:'数学与计算',l:'base',x:100,y:860,a:'优化 数值 建模',
   d:'优化、数值方法与数据分析。能源系统动不动就是上万个变量，这里提供的是建模和求解的语言。',
   k:['凸优化','动态系统','不确定性']},
  {id:'mech',n:'经典力学',l:'base',x:205,y:780,a:'牛顿 动量 功',
   d:'力、功与动量。这是“能量”概念最早被定义的地方——能量之所以有意义，是因为它能做功。',
   k:['功与能','动量守恒','振动']},
  {id:'fluid',n:'流体力学',l:'base',x:205,y:940,a:'湍流 空气动力学',
   d:'风、水、燃气和热量的载体如何流动。风机叶片与燃气轮机叶栅的外形，几乎全部由它决定。',
   k:['伯努利','边界层','湍流']},
  {id:'statphys',n:'统计物理',l:'base',x:315,y:780,a:'熵 相变',
   d:'从微观状态推到宏观量。熵、温度和自由能这些概念，严格来说都是从这里长出来的。',
   k:['系综','熵','相变']},
  {id:'thermo',n:'热力学',l:'base',core:1,x:315,y:890,a:'热学 熵 火用 卡诺',
   d:'能量守恒与不可逆性的总账本。第一定律管“有多少”，第二定律管“还能用多少”——所有能量转换的效率天花板都由它设定。',
   k:['第一定律','第二定律','火用 exergy','卡诺极限']},
  {id:'heatmass',n:'传热传质',l:'base',x:430,y:780,a:'导热 对流 辐射',
   d:'热怎么传、物质怎么扩散。它直接决定器件能承受多大功率密度——散热往往是工程里真正的瓶颈。',
   k:['导热','对流','辐射','换热器']},
  {id:'chemthermo',n:'化学热力学',l:'base',x:430,y:940,a:'反应热 吉布斯',
   d:'反应热、化学势与平衡。燃料烧掉能放多少热、合成燃料划不划算，在这里算账。',
   k:['焓','吉布斯自由能','平衡常数']},
  {id:'qm',n:'量子力学',l:'base',x:545,y:780,a:'能级 跃迁',
   d:'能级与跃迁。光伏、催化、核能这三件看似无关的事，微观起点都在这里。',
   k:['波函数','能级','隧穿']},
  {id:'catalysis',n:'催化',l:'base',x:545,y:940,a:'催化剂 电催化',
   d:'降低反应活化能。它决定了合成燃料、电解水、脱碳这些事的经济性上限。',
   k:['活性位','选择性','电催化']},
  {id:'solid',n:'固体物理',l:'base',core:1,x:660,y:780,a:'能带 半导体',
   d:'能带与载流子。光伏、LED、功率半导体，本质上都是同一套能带理论的不同应用。',

  g.addEventListener('mouseenter',function(){ if(!suppressHover) setHover(n.id); });
  g.addEventListener('mouseleave',function(){ setHover(null); });
  g.addEventListener('click',function(ev){ ev.stopPropagation(); if(suppressClick) return; select(n.id); });
});

/* 连线 */
const linkEls=[];
EDGES.forEach(function(e){
  const a=N[e[0]],b=N[e[1]];
  const p=el('path',{class:'link'});
  gLinks.appendChild(p);
  linkEls.push({a:e[0],b:e[1],el:p});
  layoutLink(linkEls[linkEls.length-1]);
});

function anchorPt(from,to){
  const dx=to.x-from.x, dy=to.y-from.y;
  if(dx===0&&dy===0) return {x:from.x,y:from.y};
  const hw=from.w/2+3, hh=from.h/2+3;
  const tx=dx===0?Infinity:hw/Math.abs(dx);
  const ty=dy===0?Infinity:hh/Math.abs(dy);
  const t=Math.min(tx,ty);
  return {x:from.x+dx*t,y:from.y+dy*t};
}
function layoutLink(L){
  const a=N[L.a],b=N[L.b];
  const p1=anchorPt(a,b),p2=anchorPt(b,a);
  const dx=p2.x-p1.x,dy=p2.y-p1.y;
  let c1,c2;
  if(Math.abs(dy)>Math.abs(dx)*0.8){
    c1={x:p1.x,y:p1.y+dy*0.45};c2={x:p2.x,y:p2.y-dy*0.45};
  }else{
    c1={x:p1.x+dx*0.45,y:p1.y};c2={x:p2.x-dx*0.45,y:p2.y};
  }
  L.el.setAttribute('d','M'+p1.x+','+p1.y+' C'+c1.x+','+c1.y+' '+c2.x+','+c2.y+' '+p2.x+','+p2.y);
}

/* ============================================================
   视图状态
   ============================================================ */
let view={k:1,tx:0,ty:0};
let selected=null,hovered=null,activePath=null;
let panelOpen=false,suppressClick=false,suppressHover=false;
let tween=null;

function applyView(){
  vp.setAttribute('transform','translate('+view.tx+' '+view.ty+') scale('+view.k+')');
}
function isPhone(){ return stage.clientWidth<700; }

function fit(){
  const w=stage.clientWidth,h=stage.clientHeight;
  const pad=26;
  const k=Math.min((w-pad*2)/WORLD.w,(h-pad*2)/WORLD.h);
  view.k=clamp(k,0.22,1.2);
  view.tx=(w-WORLD.w*view.k)/2;
  view.ty=(h-WORLD.h*view.k)/2;
  applyView();
}
function stopTween(){ if(tween){cancelAnimationFrame(tween);tween=null;} }
function animateTo(k,tx,ty){
  stopTween();
  const s={k:view.k,tx:view.tx,ty:view.ty},t0=performance.now(),dur=340;
  function step(t){
    const e=Math.min(1,(t-t0)/dur);
    const p=1-Math.pow(1-e,3);
    view.k=s.k+(k-s.k)*p;
    view.tx=s.tx+(tx-s.tx)*p;
    view.ty=s.ty+(ty-s.ty)*p;
    applyView();
    if(e<1) tween=requestAnimationFrame(step); else tween=null;
  }
  tween=requestAnimationFrame(step);
}

/* ============================================================
   高亮 / 渲染
   ============================================================ */
function paint(){
  nodeEls.forEach(function(g,id){ g.classList.remove('off','hot','inpath','fade'); });
  linkEls.forEach(function(L){ L.el.classList.remove('off','on','path'); });

  if(activePath){
    const idx={};
    activePath.steps.forEach(function(id,i){idx[id]=i;});
    nodeEls.forEach(function(g,id){
      if(idx[id]!==undefined){
        g.classList.add('inpath');
        const num=g.querySelector('.num');
        num.textContent=idx[id]+1;
      }else{
        g.classList.add('off');
      }
    });
    linkEls.forEach(function(L){
      const ia=idx[L.a],ib=idx[L.b];
      if(ia!==undefined&&ib!==undefined&&Math.abs(ia-ib)===1) L.el.classList.add('path');
      else L.el.classList.add('off');
    });
    return;
  }

  const focus=hovered||selected;
  if(focus){
    const near=new Set([focus]);
    (adj.get(focus)||[]).forEach(function(x){near.add(x);});
    nodeEls.forEach(function(g,id){
      if(id===focus) g.classList.add('hot');
      else if(!near.has(id)) g.classList.add('off');
    });
    linkEls.forEach(function(L){
      if(L.a===focus||L.b===focus) L.el.classList.add('on');
      else L.el.classList.add('off');
    });
    return;
  }

  const c=chapterObj();
  if(c.layer){
    nodeEls.forEach(function(g,id){
      if(N[id].l!==c.layer) g.classList.add('fade');
    });
    linkEls.forEach(function(L){
      if(N[L.a].l===c.layer||N[L.b].l===c.layer) return;
      L.el.classList.add('off');
    });
  }
}

function setHover(id){
  hovered=id;
  paint();
}

/* ============================================================
   选择与面板
   ============================================================ */
function layerName(l){return l==='base'?'基础科学':l==='tech'?'技术器件':'系统社会';}

function openPanel(){ panelOpen=true; panel.classList.add('open'); }
function closePanel(){

function clearSelection(){

function ensureVisible(n){
  const w=stage.clientWidth,h=stage.clientHeight;
  const panelW=(w<640||!panelOpen)?0:Math.min(392,w*0.48);
  const sx=view.tx+n.x*view.k, sy=view.ty+n.y*view.k;
  const padX=90,padY=70;
  if(sx>padX&&sx<w-panelW-padX&&sy>padY&&sy<h-padY) return;
  const cx=(w-panelW)/2, cy=h/2;
  animateTo(view.k,cx-n.x*view.k,cy-n.y*view.k);
}

function select(id){ nav('#/n/'+id); }

function openNode(id){

function openPath(p){

  const ys=p.steps.map(function(id){return N[id].y;});

  const cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;

  const panelW=w<640?0:Math.min(392,w*0.48);
  const k=clamp(view.k,0.55,1);

  hideHint();

/* ============================================================
   交互：缩放 / 平移 / 双指
   ============================================================ */
const pts=new Map();
let gesture=null;
let lastTap=0,lastTapPos=null;

function localPt(e){
  const r=svg.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function zoomAt(cx,cy,factor){
  const k2=clamp(view.k*factor,0.22,3);
  const f=k2/view.k;
  view.tx=cx-(cx-view.tx)*f;
  view.ty=cy-(cy-view.ty)*f;
  view.k=k2;
  applyView();
}

svg.addEventListener('wheel',function(e){
  e.preventDefault();
  stopTween();
  const p=localPt(e);
  zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0013));
  hideHint();
},{passive:false});

stage.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0) return;
  if(e.target.closest('#panel')) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  stopTween();
  if(pts.size===1){
    gesture={type:'pan',x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false,id:e.pointerId};
  }else if(pts.size===2){
    const a=Array.from(pts.values());
    const r=svg.getBoundingClientRect();
    const mx=(a[0].x+a[1].x)/2-r.left, my=(a[0].y+a[1].y)/2-r.top;
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    gesture={type:'pinch',d0:d,k0:view.k,moved:true,
      w0:{x:(mx-view.tx)/view.k,y:(my-view.ty)/view.k}};
    pts.forEach(function(v,id){ try{stage.setPointerCapture(id);}catch(err){} });
    suppressHover=true; setHover(null); hideHint();
  }
});

stage.addEventListener('pointermove',function(e){
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gesture) return;

  if(gesture.type==='pinch'&&pts.size>=2){
    const a=Array.from(pts.values());
    const r=svg.getBoundingClientRect();
    const mx=(a[0].x+a[1].x)/2-r.left, my=(a[0].y+a[1].y)/2-r.top;
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    const k=clamp(gesture.k0*(d/gesture.d0),0.22,3);
    view.k=k;
    view.tx=mx-gesture.w0.x*k;
    view.ty=my-gesture.w0.y*k;
    applyView();
    return;
  }

  if(gesture.type==='pan'){
    const dx=e.clientX-gesture.x, dy=e.clientY-gesture.y;
    if(!gesture.moved&&Math.abs(dx)+Math.abs(dy)>4){
      gesture.moved=true;
      stage.classList.add('grabbing');
      try{stage.setPointerCapture(e.pointerId);}catch(err){}
      suppressHover=true;
      setHover(null);
      hideHint();
    }
    if(gesture.moved){ view.tx=gesture.tx+dx; view.ty=gesture.ty+dy; applyView(); }
  }
});

function endPointer(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);

  if(gesture&&gesture.type==='pinch'){
    if(pts.size>=1){
      const id=pts.keys().next().value, p=pts.get(id);
      gesture={type:'pan',x:p.x,y:p.y,tx:view.tx,ty:view.ty,moved:true,id:id};
    }else{
      gesture=null; suppressHover=false; stage.classList.remove('grabbing');
    }
    return;
  }
  if(!gesture) return;

  const moved=gesture.moved, id=gesture.id;
  gesture=null;
  stage.classList.remove('grabbing');
  suppressHover=false;

  if(moved){
    suppressClick=true; setTimeout(function(){suppressClick=false;},60);
    return;
  }
  if(id!==e.pointerId) return;

  if(e.pointerType!=='mouse'){
    const now=Date.now();
    if(lastTapPos&&now-lastTap<320&&Math.hypot(e.clientX-lastTapPos.x,e.clientY-lastTapPos.y)<30){
      const p=localPt(e);
      zoomAt(p.x,p.y,1.9);
      lastTap=0; lastTapPos=null;
      suppressClick=true; setTimeout(function(){suppressClick=false;},60);
      hideHint();
      return;
    }
    lastTap=now; lastTapPos={x:e.clientX,y:e.clientY};
  }
  if(!e.target.closest('.node')&&!e.target.closest('#panel')) clearSelection();
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);

   章节（翻页）

const CHAPTERS=[
  {id:'overview',name:'总览',band:null},
  {id:'base',name:'基础层',band:[730,1000],layer:'base'},
  {id:'tech',name:'技术层',band:[360,660],layer:'tech'},
  {id:'sys',name:'系统层',band:[60,270],layer:'sys'},
  {id:'paths',name:'学习路径',band:null}
];
const COLOR={base:'#38bdf8',tech:'#fbbf24',sys:'#a78bfa'};
let chapter='overview';
let inited=false;

function chapterObj(){
  for(let i=0;i<CHAPTERS.length;i++) if(CHAPTERS[i].id===chapter) return CHAPTERS[i];
  return CHAPTERS[0];
}
function chIndex(){
  for(let i=0;i<CHAPTERS.length;i++) if(CHAPTERS[i].id===chapter) return i;
  return 0;
}

const chBox=document.querySelector('#chapters .ch');
CHAPTERS.forEach(function(c){
  const b=document.createElement('button');
  b.className='cbtn'; b.textContent=c.name; b.setAttribute('data-c',c.id);
  b.addEventListener('click',function(){ closeRail(); nav('#/'+c.id); });
  chBox.appendChild(b);
});

function renderTabs(){
  document.querySelectorAll('.cbtn').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-c')===chapter);
  });
  document.getElementById('cnum').textContent=(chIndex()+1)+' / '+CHAPTERS.length;
}

function renderToc(){
  const box=document.getElementById('toc');
  const head=document.getElementById('toch');
  let html='';
  if(chapter==='paths'){
    head.textContent='四条路径 · '+PATHS.length;
    html=PATHS.map(function(p){
      return '<button class="toc-item" data-p="'+p.id+'"><i style="background:#38bdf8"></i>'+
        p.name+'<em>'+p.steps.length+'</em></button>';
    }).join('');
  }else{
    const c=chapterObj();
    const layers=c.layer?[c.layer]:['base','tech','sys'];
    head.textContent=c.layer
      ? layerName(c.layer)+' · '+NODES.filter(function(n){return n.l===c.layer;}).length
      : '全部节点 · '+NODES.length;
    layers.forEach(function(l){
      const list=NODES.filter(function(n){return n.l===l;});
      if(!c.layer) html+='<div class="toc-group">'+layerName(l)+' · '+list.length+'</div>';
      html+=list.map(function(n){
        return '<button class="toc-item" data-n="'+n.id+'"><i style="background:'+COLOR[l]+'"></i>'+n.n+'</button>';
      }).join('');
    });
  }
  box.innerHTML=html;
  box.querySelectorAll('.toc-item').forEach(function(b){
    b.addEventListener('click',function(){
      closeRail();
      if(b.hasAttribute('data-n')) nav('#/n/'+b.getAttribute('data-n'));
      else nav('#/p/'+b.getAttribute('data-p'));
    });

  markToc();
}

function markToc(){
  document.querySelectorAll('.toc-item').forEach(function(b){
    const id=b.getAttribute('data-n');
    b.classList.toggle('on',!!id&&id===selected);
  });
}

function frameBand(y0,y1,instant){
  const w=stage.clientWidth,h=stage.clientHeight;
  const k=clamp(Math.min((w-70)/1360,(h-90)/(y1-y0)),w<700?0.8:0.3,1.6);
  const tx=w/2-700*k, ty=h/2-((y0+y1)/2)*k;
  if(instant){ stopTween(); view.k=k; view.tx=tx; view.ty=ty; applyView(); }
  else animateTo(k,tx,ty);
}
function fitAnim(){
  const w=stage.clientWidth,h=stage.clientHeight;
  const k=clamp(Math.min((w-52)/WORLD.w,(h-52)/WORLD.h),0.22,1.2);
  animateTo(k,(w-WORLD.w*k)/2,(h-WORLD.h*k)/2);
}

function goChapter(id){
  let c=CHAPTERS[0];
  CHAPTERS.forEach(function(x){ if(x.id===id) c=x; });
  chapter=c.id;
  selected=null; activePath=null;
  nodeEls.forEach(function(g){g.classList.remove('sel');});
  closePanel();
  renderTabs(); renderToc(); paint();
  if(c.band) frameBand(c.band[0],c.band[1],!inited);
  else if(!inited){ stopTween(); fit(); }
  else fitAnim();
  inited=true;
  hideHint();
}

function nav(h){
  if(location.hash===h) applyHash();
  else location.hash=h;
}

function applyHash(){
  const raw=location.hash.replace(/^#\/?/,'');
  if(raw.indexOf('n/')===0&&N[raw.slice(2)]){ openNode(raw.slice(2)); return; }
  if(raw.indexOf('p/')===0){
    let p=null;
    PATHS.forEach(function(x){ if(x.id===raw.slice(2)) p=x; });
    if(p){
      if(chapter!=='paths'){ chapter='paths'; renderTabs(); renderToc(); }
      openPath(p); return;
    }
  }
  let ok=false;
  CHAPTERS.forEach(function(c){ if(c.id===raw) ok=true; });
  if(ok&&raw) goChapter(raw);
  else goChapter(isPhone()?'tech':'overview');
}

function stepCh(d){
  const i=(chIndex()+d+CHAPTERS.length)%CHAPTERS.length;
  nav('#/'+CHAPTERS[i].id);
}

/* ============================================================
   搜索
   ============================================================ */
const q=document.getElementById('q');
const results=document.getElementById('results');
let resultItems=[],actIdx=-1;

function search(term){
  const t=term.trim().toLowerCase();
  if(!t){results.classList.remove('show');results.innerHTML='';resultItems=[];return;}
  resultItems=NODES.filter(function(n){
    const hay=(n.n+' '+(n.a||'')+' '+n.k.join(' ')+' '+(n.d||'')).toLowerCase();
    return hay.indexOf(t)>=0;
  }).slice(0,8);
  if(!resultItems.length){
    results.innerHTML='<div style="padding:10px 12px;font-size:12px;color:var(--dim)">没有匹配的节点</div>';
    results.classList.add('show');
    return;
  }
  results.innerHTML=resultItems.map(function(n,i){
    return '<button data-i="'+i+'"><span class="dot" style="background:'+
      (n.l==='base'?'#38bdf8':n.l==='tech'?'#fbbf24':'#a78bfa')+
      '"></span>'+n.n+'<span class="ly">'+(n.l==='base'?'基础':n.l==='tech'?'技术':'系统')+'</span></button>';
  }).join('');
  results.classList.add('show');
  actIdx=-1;
  results.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      const n=resultItems[+b.getAttribute('data-i')];
      q.value='';results.classList.remove('show');
      select(n.id);
    });
  });
}
q.addEventListener('input',function(){search(q.value);});
q.addEventListener('focus',function(){ if(q.value) search(q.value); });
q.addEventListener('keydown',function(e){
  const btns=results.querySelectorAll('button');
  if(e.key==='Escape'){ q.value='';results.classList.remove('show');q.blur();return; }
  if(!btns.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    actIdx=(actIdx+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length;
    btns.forEach(function(b,i){b.classList.toggle('act',i===actIdx);});
    btns[actIdx].scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'){
    const b=btns[actIdx>=0?actIdx:0];
    if(b){b.click();}
  }
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.search')) results.classList.remove('show');
});

document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT') return;
  if(e.key==='Escape'){ clearSelection(); return; }
  if(e.key==='ArrowRight'){ e.preventDefault(); stepCh(1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); stepCh(-1); }
});

let hintTimer=setTimeout(hideHint,9000);
function hideHint(){ hint.classList.add('hide'); clearTimeout(hintTimer); }

/* init */
window.addEventListener('hashchange',applyHash);
applyHash();
inited=true;

requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    if(chapter==='overview'&&!selected&&!activePath) fit();
  });
});

})();
</script>
